[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MPL-2.0"
repository = "https://github.com/ferranbt/pinecone"
homepage = "https://github.com/ferranbt/pinecone"

[workspace]
members = [
    "crates/pine-broker",
    "crates/pine-core",
    "crates/pine-data",
    "crates/pine-lexer",
    "crates/pine-ast",
    "crates/pine-diagnostics",
    "crates/pine-format",
    "crates/pine-parser",
    "crates/pine-interpreter",
    "crates/pine-builtin-macro",
    "crates/pine-builtins",
    "crates/pine-lint",
    "crates/pine-sema",
    "crates/pine",
    "crates/pine-reference",
    "tests",
    "benches",
]
resolver = "2"

[workspace.dependencies]
pine-broker = { path = "crates/pine-broker", version = "0.1.0" }
pine-core = { path = "crates/pine-core", version = "0.1.0" }
pine-data = { path = "crates/pine-data", version = "0.1.0" }
pine-lexer = { path = "crates/pine-lexer", version = "0.1.0" }
pine-parser = { path = "crates/pine-parser", version = "0.1.0" }
pine-ast = { path = "crates/pine-ast", version = "0.1.0" }
pine-diagnostics = { path = "crates/pine-diagnostics", version = "0.1.0" }
pine-format = { path = "crates/pine-format", version = "0.1.0" }
pine-interpreter = { path = "crates/pine-interpreter", version = "0.1.0" }
pine-builtin-macro = { path = "crates/pine-builtin-macro", version = "0.1.0" }
pine-builtins = { path = "crates/pine-builtins", version = "0.1.0" }
pine-lint = { path = "crates/pine-lint", version = "0.1.0" }
pine-sema = { path = "crates/pine-sema", version = "0.1.0" }
pine-lang = { path = "crates/pine", version = "0.1.0" }
pine-reference = { path = "crates/pine-reference", version = "0.1.0" }
eyre = "0.6"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1.3"
ureq = { version = "2.10", features = ["json"] }
