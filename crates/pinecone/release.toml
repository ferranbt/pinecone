# Bump the VS Code extension's version in lockstep with the crates. Kept on this
# single crate (not the workspace config, which is applied per-crate and can't
# reach a workspace-root file) so it runs exactly once, relative to this dir.
pre-release-replacements = [
    { file = "../../editors/vscode/package.json", search = "\"version\": \"[0-9]+\\.[0-9]+\\.[0-9]+\"", replace = "\"version\": \"{{version}}\"", prerelease = true },
]
